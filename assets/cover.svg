<svg xmlns="http://www.w3.org/2000/svg" width="900" height="383" viewBox="0 0 900 383">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F2027"/>
      <stop offset="50%" style="stop-color:#203A43"/>
      <stop offset="100%" style="stop-color:#2C5364"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00F5A0"/>
      <stop offset="100%" style="stop-color:#00D9F5"/>
    </linearGradient>
  </defs>
  <rect width="900" height="383" fill="url(#bg)" rx="0"/>
  
  <!-- 装饰性网格线 -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="0" y1="320" x2="900" y2="320"/>
    <line x1="150" y1="0" x2="150" y2="383"/>
    <line x1="300" y1="0" x2="300" y2="383"/>
    <line x1="450" y1="0" x2="450" y2="383"/>
    <line x1="600" y1="0" x2="600" y2="383"/>
    <line x1="750" y1="0" x2="750" y2="383"/>
  </g>
  
  <!-- AI图标 - 神经网络节点 -->
  <g transform="translate(80, 120)">
    <circle cx="0" cy="0" r="8" fill="url(#accent)"/>
    <circle cx="0" cy="50" r="8" fill="url(#accent)" opacity="0.8"/>
    <circle cx="0" cy="100" r="8" fill="url(#accent)" opacity="0.6"/>
    <circle cx="60" cy="25" r="8" fill="url(#accent)" opacity="0.9"/>
    <circle cx="60" cy="75" r="8" fill="url(#accent)" opacity="0.7"/>
    <circle cx="120" cy="50" r="10" fill="url(#accent)"/>
    
    <line x1="0" y1="0" x2="60" y2="25" stroke="#00F5A0" stroke-width="1.5" opacity="0.5"/>
    <line x1="0" y1="0" x2="60" y2="75" stroke="#00F5A0" stroke-width="1.5" opacity="0.3"/>
    <line x1="0" y1="50" x2="60" y2="25" stroke="#00F5A0" stroke-width="1.5" opacity="0.4"/>
    <line x1="0" y1="50" x2="60" y2="75" stroke="#00F5A0" stroke-width="1.5" opacity="0.5"/>
    <line x1="0" y1="100" x2="60" y2="75" stroke="#00F5A0" stroke-width="1.5" opacity="0.3"/>
    <line x1="60" y1="25" x2="120" y2="50" stroke="#00F5A0" stroke-width="1.5" opacity="0.6"/>
    <line x1="60" y1="75" x2="120" y2="50" stroke="#00F5A0" stroke-width="1.5" opacity="0.5"/>
  </g>
  
  <!-- 标题 -->
  <text x="250" y="140" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="52" font-weight="bold" fill="#ffffff">
    AI &amp; LLM
  </text>
  <text x="250" y="200" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="52" font-weight="bold" fill="url(#accent)">
    DAILY BRIEFING
  </text>
  
  <!-- 副标题 -->
  <text x="250" y="245" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="20" fill="#ffffff" opacity="0.7">
    全球 AI 与大模型每日简报
  </text>
  
  <!-- 日期标签 -->
  <rect x="250" y="270" width="120" height="36" rx="18" fill="url(#accent)" opacity="0.2"/>
  <text x="310" y="293" font-family="-apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#00F5A0" text-anchor="middle">
    每日更新
  </text>
  
  <!-- 右侧装饰 - 电路线 -->
  <g transform="translate(750, 60)" stroke="url(#accent)" stroke-width="2" fill="none" opacity="0.4">
    <path d="M 0 0 L 40 0 L 40 40 L 80 40 L 80 0 L 120 0"/>
    <path d="M 0 80 L 20 80 L 20 120 L 60 120 L 60 80 L 120 80"/>
    <path d="M 0 160 L 40 160 L 40 200 L 100 200"/>
    <circle cx="0" cy="0" r="4" fill="#00F5A0"/>
    <circle cx="120" cy="0" r="4" fill="#00F5A0"/>
    <circle cx="0" cy="80" r="4" fill="#00F5A0"/>
    <circle cx="120" cy="80" r="4" fill="#00F5A0"/>
    <circle cx="0" cy="160" r="4" fill="#00F5A0"/>
    <circle cx="100" cy="200" r="4" fill="#00F5A0"/>
  </g>
  
  <!-- 底部线 -->
  <rect x="0" y="375" width="900" height="8" fill="url(#accent)" opacity="0.6"/>
</svg>